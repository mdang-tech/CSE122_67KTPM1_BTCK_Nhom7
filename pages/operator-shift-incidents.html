<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sự cố ca của tôi – LineWatch</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="operator-shift-incidents">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="index.html">⚙ LineWatch</a>
      <nav id="main-nav"></nav>
      <div class="topbar-user" id="topbar-user"></div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Sự cố ca của tôi</h1>
    <p class="page-subtitle">Theo dõi các sự cố bạn đã báo: tìm kiếm, lọc, sửa thông tin hoặc hủy báo cáo sai.</p>

    <div class="toolbar">
      <input type="text" id="search-box" class="input" placeholder="🔍 Tìm theo tiêu đề, tên máy...">
      <select id="filter-status" class="select">
        <option value="all">Mọi trạng thái</option>
        <option value="Mới">Mới</option>
        <option value="Đang chờ">Đang chờ</option>
        <option value="Đang xử lý">Đang xử lý</option>
        <option value="Đã xử lý">Đã xử lý</option>
        <option value="Đã hủy">Đã hủy</option>
      </select>
      <select id="filter-priority" class="select">
        <option value="all">Mọi mức ưu tiên</option>
        <option value="Cao">Cao</option>
        <option value="Trung bình">Trung bình</option>
        <option value="Thấp">Thấp</option>
      </select>
      <a href="operator-incident-create.html" class="btn btn-danger">+ Báo sự cố mới</a>
      <button class="btn btn-outline btn-sm" id="btn-reset">Xóa bộ lọc</button>
    </div>

    <div class="text-muted mb-8" id="result-count"></div>

    <div class="card">
      <div class="table-wrap" id="incident-table-box"></div>
    </div>
  </main>

  <!-- Modal xem chi tiet -->
  <div class="modal-overlay" id="modal-detail">
    <div class="modal">
      <div class="modal-header">
        <h3>Chi tiết sự cố</h3>
        <button class="modal-close" onclick="closeModal('modal-detail')">✕</button>
      </div>
      <div id="modal-detail-body"></div>
    </div>
  </div>

  <!-- Modal sua su co -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <div class="modal-header">
        <h3>Sửa sự cố</h3>
        <button class="modal-close" onclick="closeModal('modal-edit')">✕</button>
      </div>
      <form id="edit-form">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label for="edit-title">Tiêu đề</label>
          <input type="text" id="edit-title" class="input">
        </div>
        <div class="form-group">
          <label for="edit-desc">Mô tả</label>
          <textarea id="edit-desc" class="textarea"></textarea>
        </div>
        <div class="form-group">
          <label for="edit-category">Loại sự cố</label>
          <select id="edit-category" class="select"></select>
        </div>
        <div class="form-group">
          <label for="edit-priority">Mức ưu tiên</label>
          <select id="edit-priority" class="select"></select>
        </div>
        <div class="error-msg" id="err-edit">Tiêu đề tối thiểu 5 ký tự, mô tả tối thiểu 15 ký tự.</div>
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
      </form>
    </div>
  </div>

  <footer class="footer">LineWatch – BTL CSE122</footer>
  <div id="toast-box"></div>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages/operator-shift-incidents.js"></script>
</body>
</html>
