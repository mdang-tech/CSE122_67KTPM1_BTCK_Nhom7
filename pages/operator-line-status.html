<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trạng thái line – LineWatch</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="operator-line-status">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="index.html">⚙ LineWatch</a>
      <nav id="main-nav"></nav>
      <div class="topbar-user" id="topbar-user"></div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Trạng thái line</h1>
    <p class="page-subtitle">Theo dõi tình trạng máy của từng dây chuyền. Máy có vấn đề cần báo ngay ở nút "Báo sự cố".</p>

    <div class="toolbar">
      <select id="filter-line" class="select">
        <option value="all">Tất cả dây chuyền</option>
      </select>
      <select id="filter-status" class="select">
        <option value="all">Tất cả trạng thái</option>
        <option value="running">Đang chạy</option>
        <option value="warning">Cảnh báo</option>
        <option value="stopped">Dừng</option>
      </select>
      <a href="operator-incident-create.html" class="btn btn-danger">🚨 Báo sự cố</a>
    </div>

    <div id="line-list"></div>
  </main>

  <footer class="footer">LineWatch – BTL CSE122</footer>
  <div id="toast-box"></div>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages/operator-line-status.js"></script>
</body>
</html>
